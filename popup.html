<!DOCTYPE html>
<html>
<head>
  <title>MultiStream Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <h2>MultiStream Chat Viewer</h2>

  <!-- Twitch Input -->
  <input id="twitchLink" placeholder="Paste Twitch Channel Link..." />
  <button id="addTwitch">+ Add Twitch</button>
  <button id="refreshTwitch">Refresh Twitch Chat</button>

  <!-- YouTube Input -->
  <input id="ytLink" placeholder="Paste YouTube Live Link..." />
  <button id="addYT">+ Add YouTube</button>
  <button id="refreshYT">Refresh YouTube Chat</button>

  <!-- Combined Chat Feed -->
  <div id="chatBox"></div>

  <script src="popup.js"></script>

</body>
</html>
